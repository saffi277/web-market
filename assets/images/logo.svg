<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C56A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8882E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark green rounded rectangle background -->
  <rect width="80" height="80" rx="12" ry="12" fill="#0D3D2E"/>
  <!-- Subtle inner border for luxury feel -->
  <rect x="3" y="3" width="74" height="74" rx="10" ry="10" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
  <!-- ZM letters in gold serif style -->
  <text
    x="40"
    y="52"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="700"
    fill="url(#goldGrad)"
    text-anchor="middle"
    letter-spacing="-1"
    filter="url(#glow)"
  >ZM</text>
  <!-- Decorative gold line under text -->
  <line x1="18" y1="58" x2="62" y2="58" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
</svg>
