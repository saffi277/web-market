<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="zmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13131A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="80" height="80" rx="12" ry="12" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect x="2" y="2" width="76" height="76" rx="11" ry="11" fill="none" stroke="url(#zmGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Z letter -->
  <text x="6" y="58" font-family="Georgia, serif" font-size="52" font-weight="700"
        fill="url(#zmGrad)" opacity="0.75" filter="url(#glow)">Z</text>

  <!-- M letter overlapping -->
  <text x="34" y="64" font-family="Georgia, serif" font-size="58" font-weight="700"
        fill="url(#zmGrad)" filter="url(#glow)">M</text>

  <!-- Decorative line -->
  <line x1="8" y1="70" x2="72" y2="70" stroke="url(#zmGrad)" stroke-width="0.8" opacity="0.4"/>
</svg>
